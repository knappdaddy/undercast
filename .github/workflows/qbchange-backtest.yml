name: QB-Change Backtest

# Does a mid-game starting-QB change predict the rest of the game going under?
# nflverse play-by-play. No key.

on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season range (2016-2024)"
        default: "2016-2024"
        required: true

jobs:
  qbchange:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run QB-change backtest
        env:
          SEASONS: ${{ inputs.seasons }}
        run: |
          node tools/backtest-qbchange.mjs "$SEASONS" | tee /tmp/out.txt
          { echo '### QB-change backtest — '"$SEASONS"; echo '```'; cat /tmp/out.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
